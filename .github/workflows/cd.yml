name: CD

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build source bundle
        run: |
          mkdir -p dist
          git archive --format=tar.gz --output=dist/smart-contracts-stellar-${GITHUB_SHA}.tar.gz HEAD

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-bundle-${{ github.sha }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: package
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build source bundle
        run: |
          mkdir -p dist
          git archive --format=tar.gz --output=dist/smart-contracts-stellar-${GITHUB_REF_NAME}.tar.gz HEAD

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
